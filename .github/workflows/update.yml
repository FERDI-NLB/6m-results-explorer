name: Verify official results and publish
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nlb-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check and update verified official results
        run: python scripts/update.py
      - name: Commit changed dataset and webpage
        run: |
          if [[ -n "$(git status --porcelain -- data.xlsx docs/index.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.xlsx docs/index.html
            git commit -m "Update verified Mahajana Sampatha draw results"
            git push
          fi
