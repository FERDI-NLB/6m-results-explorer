name: Verify official results and publish
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nlb-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Record hourly check attempt
        run: |
          python - <<'PY'
          import json, datetime, pathlib
          p=pathlib.Path('docs/status.json')
          try: s=json.loads(p.read_text(encoding='utf-8'))
          except Exception: s={}
          s.setdefault('baseline_draw',6348); s.setdefault('latest_verified_draw',6348)
          s.setdefault('last_successful_check_at',None); s.setdefault('last_updated_at',None); s.setdefault('last_updated_draws',[])
          s['state']='checking'
          s['last_attempt_at']=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          s['message']='Scheduled check started; waiting for official source validation.'
          p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(s,indent=2)+'\n',encoding='utf-8')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check and update verified official results
        id: update
        run: python scripts/update.py
      - name: Mark incomplete workflow as failed
        if: failure()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('docs/status.json')
          try: s=json.loads(p.read_text(encoding='utf-8'))
          except Exception: s={}
          if s.get('state') == 'checking':
              s['state']='error'
              s['message']='The workflow failed before the result check completed. Open the Actions log for details.'
              s['last_error']='Workflow step failed before a final status was recorded.'
              p.write_text(json.dumps(s,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit changed dataset, status and webpage
        if: always()
        run: |
          if [[ -n "$(git status --porcelain -- data.xlsx docs/index.html docs/status.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.xlsx docs/index.html docs/status.json
            git commit -m "Update result checker status and verified draws"
            git push
          fi
